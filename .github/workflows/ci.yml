name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.13.1"
  PYTHON_VERSION: "3.12.14"
jobs:
  tools:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked zetra-agents --repo .. check
      - id: list
        run: echo "agents=$(uv run --locked zetra-agents --repo .. list)" >> "$GITHUB_OUTPUT"

  agent:
    needs: tools
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.tools.outputs.agents) }}
    defaults:
      run:
        working-directory: agents/${{ matrix.agent }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - name: Build the image (not pushed)
        run: docker build --platform linux/amd64 -t "agent-${{ matrix.agent }}:ci" .
      - name: The image's tools match its manifest
        run: |
          docker run --rm --read-only --user 1500:1500 --network none \
            --tmpfs /sandbox --tmpfs /tmp -e AGENT_SANDBOX_DIR=/sandbox \
            --entrypoint /app/.venv/bin/python "agent-${{ matrix.agent }}:ci" \
            -c "from agent_runtime import step; print(sorted(step.build_agent(step.load_manifest())[1]))"

  legacy-openshell-investigator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/openshell-investigator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked zetra check .
      - run: uv run --locked python evals/run.py
      - run: uv build --wheel
      - run: uv run --locked python tests/packaging/check_wheel.py dist/*.whl
