# The OpenShell POC under legacy/ keeps its own checks; the rendered ci.yml covers the agents.
name: Legacy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-openshell-investigator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/openshell-investigator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.13.1"
          python-version: "3.12.14"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked zetra check .
      - run: uv run --locked python evals/run.py
      - run: uv build --wheel
      - run: uv run --locked python tests/packaging/check_wheel.py dist/*.whl
