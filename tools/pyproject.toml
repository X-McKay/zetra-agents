[project]
name = "zetra-agents-tools"
version = "0.1.0"
description = "Checks and release-artifact generation for the agents in this repository"
requires-python = ">=3.12,<3.13"
# The contracts compute the policy digest; they must be the same commit the Registry
# Controller runs, or the recomputed digest will not match spec.policySha256.
dependencies = [
    "PyYAML==6.0.3",
    "agent-runtime @ git+https://github.com/X-McKay/zetra.git@083967c1c1e91918d76405c5fa3da06150c60a25#subdirectory=platform/agent-runtime",
    "agent-platform-contracts @ git+https://github.com/X-McKay/zetra.git@bba8b097789e1b3b6632052ce8e954c6b8c2a669#subdirectory=platform/contracts",
]

[project.scripts]
zetra-agents = "zetra_agents.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zetra_agents"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
