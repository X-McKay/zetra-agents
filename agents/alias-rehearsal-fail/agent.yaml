schema_version: 1
name: alias-rehearsal-fail
entrypoint: alias_rehearsal_fail.agent:create_agent
instructions: alias_rehearsal_fail/instructions/base.md
model:
  backend: llm-fast
  name: fast
  max_tokens: 128
  temperature: 0
tools:
  - name: answer
    effect: workspace_write
requires:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: Rehearsal agent for moving the fast model alias; fails by construction after the move
  tenant: tenant-test
  identity: {mode: agent}
  # The gateway reserves llm-fast's whole context, 32768 tokens, for each call. The tool
  # makes a call of its own while the session's is still unsettled: two at once, plus spend.
  budget: {tokensPerDay: 200000, tokensPerSession: 70000}
  runtime: {cpu: "1", memory: 1Gi, ttlSeconds: 300}
