[project]
name = "zetra-agent-alias-rehearsal-fail"
version = "0.1.1"
description = "Rehearsal agent for moving the fast model alias"
requires-python = ">=3.12,<3.13"
# The sandbox SDK; its zetra commit is pinned once in the root pyproject.
dependencies = [
    "agent-runtime",
]

# The agent package is copied to /app/alias_rehearsal_fail, not installed (spec 11.7).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
