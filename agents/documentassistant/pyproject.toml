[project]
name = "zetra-agent-documentassistant"
version = "0.1.0"
description = "Extractive document assistant using approved packaged sources"
requires-python = ">=3.12,<3.13"
# The image lock: uv.lock is AgentRelease.spec.lockSha256. The SDK is pinned to a zetra commit.
dependencies = [
    "agent-runtime @ git+https://github.com/X-McKay/zetra.git@1393cf0286f16245219d9446b6e1b677ade92ff4#subdirectory=platform/agent-runtime",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documentassistant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.zetra.agents]
documentassistant = "src/documentassistant/agent.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
