# Agent (spec 15.1): the platform's conformance test agent. It runs adversarial probes
# for the test harness and does no real work. Kubani holds the copy that is applied; this
# file is its source and the input to `just release conformance`.
apiVersion: agentplatform.io/v1alpha1
kind: Agent
metadata:
  name: conformance
  namespace: tenant-test
spec:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: Conformance test agent for the Agent Runtime Platform (spec 15.1)
  identity:
    mode: on-behalf-of
    onBehalfOf: {required: false, fallback: agent}
  capabilities:
    models:
      - backend: llm-main
        models: [Qwen3.6-35B-A3B-NVFP4]
        budget: {tokensPerDay: 500000, tokensPerSession: 50000}
    mcp:
      - backend: kubernetes
        effect: remote_read
        tools: [pods_list_in_namespace]
        delegation: inherit
  runtime: {cpu: "1", memory: 1Gi, ttlSeconds: 1800}
