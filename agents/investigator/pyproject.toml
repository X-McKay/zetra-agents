[project]
name = "zetra-agent-investigator"
version = "0.1.0"
description = "Read-only Kubernetes investigator for the Agent Runtime Platform"
requires-python = ">=3.12,<3.13"
# The image lock: uv.lock is AgentRelease.spec.lockSha256. The SDK is pinned to a zetra commit.
dependencies = [
    "agent-runtime @ git+https://github.com/X-McKay/zetra.git@cf158f8979da6c160bc37f6a2b2592ab4e8c0ef2#subdirectory=platform/agent-runtime",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.zetra.agents]
investigator = "src/investigator/agent.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
