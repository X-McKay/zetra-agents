schema_version: 1
name: skill-rehearsal
entrypoint: skill_rehearsal.agent:create_agent
instructions: skill_rehearsal/instructions/base.md
# No model: the agent's own `decide` picks each step, so every session of it is the same.
model: null
skills:
  - report-check
tools:
  - name: write_note
    effect: workspace_write
  - name: record_check
    effect: workspace_write
requires:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: Rehearsal agent for skills with scripts; writes a report and runs a skill's script to check it
  tenant: tenant-test
  identity: {mode: agent}
  effects: [sandbox_execute]
  runtime: {cpu: "1", memory: 1Gi, ttlSeconds: 300}
