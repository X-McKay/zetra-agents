[project]
name = "zetra-agent-db-admin"
version = "0.1.2"
description = "Read-only PostgreSQL diagnostic adviser through agentgateway"
requires-python = ">=3.12,<3.13"
# The sandbox SDK; its zetra commit is pinned once in the root pyproject.
dependencies = [
    "agent-runtime",
]

# The agent package is copied to /app/db_admin, not installed (spec 11.7).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
