schema_version: 1
name: db-admin
entrypoint: db_admin.agent:create_agent
instructions: db_admin/instructions/base.md
model:
  backend: llm-main
  name: main
  max_tokens: 1024
  temperature: 0
skills:
  - report-check
tools:
  - name: inspect_instance
    effect: remote_read
  - name: inspect_connections
    effect: remote_read
  - name: inspect_database_stats
    effect: remote_read
  - name: inspect_blocking
    effect: remote_read
  - name: write_report
    effect: workspace_write
requires:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: Read-only database health adviser using redacted monitoring views through agentgateway
  tenant: tenant-test
  identity: {mode: agent}
  budget: {tokensPerDay: 1000000, tokensPerSession: 200000}
  tools:
    - backend: postgres-admin
      effect: remote_read
      tools: [execute_sql]
      delegation: inherit
  # The skill's script runs in the agent's container; the tenant must grant this.
  effects: [sandbox_execute]
  runtime: {cpu: "1", memory: 2Gi, ttlSeconds: 900}
